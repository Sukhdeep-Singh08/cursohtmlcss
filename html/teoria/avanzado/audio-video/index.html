<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video src="" autoplay controls muted>
        <track src="" default kind="subtitles" srclang="es"></track>
        <!-- Para poner los subtitulos, kind para decirle al navegador que son subtitulos. srclang="es" para que los subtitulos ponga que es Español para cambiar el tipo de Español ponemos label="Español (Latinoamericano)"-->
        <!-- ------------------------------- 
        Para editar los subtitulos pues necessitamso JavaScript o desde la configuración del archivo btt. 
        -->
        Tu navegador no soporta video
    </video>
    <!-- src= donde ponemos el video -->
    <!-- autoplay para que se reproduzca automaticamente ( Con muted iria mejor )-->
    <!-- Controls hace que se reproduzca si o si para parar, descargar, pantalla completa,etc. -->
    <!-- Con el atributo muted cada vez que recargues la pagina pues se iniciara siempre. -->
    <!-- Loop para que vaya en bucle -->
    <audio src="" autoplay controls muted>
        Tu navegador no soporta el audio
    </audio>
    <!-- El audio lo mejor seria que sea un archivo de audio, asi la etiqueta audio solo carga el audio y no solo el video + el audio. Esto para que cargue mucho mas rapido. -->
</body>
</html>
