<!DOCTYPE html>
<html lang="en"> <!-- Lang para poner en q lenguaje esta-->
<head>
    <meta charset="UTF-8"> <!-- Codificación en la que esta el documento, para poner cualquier caracter del mundo-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- adapatar lo que nosotros escribimos en otros dispositivos-->
    <title>Comentario, Metatags i Favicon</title>
    <meta name="description" content="Para describir el contenido de la página web, es decir que de se trara como la encotnraremos por internet.">
    <link rel="shortcut icon" href="imatge/icons8-finn-50.png" type="image/x-icon">
    <meta name="keywords" content="fruta, manzana"> <!-- Cuando alguien busque por internet sobre un tema nuestra página web puede salir antes o no dependiendo de las palabras clave que hayamos puesto.-->
    <meta name="author" content="Sukhdeep"> <!-- Para poner el autor de nuestra página web-->
    <meta name="robots" content="nofollow"> <!-- Si el contenido es no follow, significa que no muestres mi página en los resultados de Internet.En cambio si es nosnippet, denega que cualquier motor de busqueda pueda agarrar cualquier tipo de fragmento/ información de nuestra página.Tenemos otro que es el noarchive que hacemos que google no pueda almacenar una copia de nuestra página web en el cache. Aparte, esta el de noimageindex que no salga en el apartado de imagenes del navegador.-->
    <meta name="OG:title" content=""> 
    <meta name="OG:image" content=""> 
    <meta name="OG:description" content=""> 
    <!-- Esta etiqueta lo que hace es que al poner el enlace de la pàgina, salga una información como el titulo, una imagen o descripción. -->
</head>
